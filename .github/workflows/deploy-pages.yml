name: Deploy portfolio

on:
  push:
    branches: [main]
    paths:
      - config.json
      - template-version.json
      - CNAME
      - assets/**
      - media/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PORTFOLIO_CONFIG: ${{ github.workspace }}/config.json
  PORTFOLIO_OUTPUT: ${{ github.workspace }}/.portfolio-engine/dist

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout portfolio content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read pinned engine version
        id: engine
        run: echo "version=$(jq -r .version template-version.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned portfolio engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: yashrajnayak/developer-portfolio
          ref: ${{ steps.engine.outputs.version }}
          path: .portfolio-engine

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .portfolio-engine/package-lock.json

      - name: Install engine dependencies
        working-directory: .portfolio-engine
        run: npm ci

      - name: Install Chromium
        working-directory: .portfolio-engine
        run: npx playwright install --with-deps chromium

      - name: Validate, test, and build
        working-directory: .portfolio-engine
        run: |
          npm run validate:config -- "$PORTFOLIO_CONFIG"
          npm run build
          npm run validate:html
          npm run check:links
          npm run test:unit
          npm run test:e2e
          npm audit --audit-level=moderate

      - name: Check repository for machine-specific paths
        run: |
          CONTENT_SCAN=$(mktemp -d)
          git archive HEAD | tar -x -C "$CONTENT_SCAN"
          cd "$CONTENT_SCAN"
          node "$GITHUB_WORKSPACE/.portfolio-engine/scripts/check-local-paths.mjs"

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: .portfolio-engine/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
