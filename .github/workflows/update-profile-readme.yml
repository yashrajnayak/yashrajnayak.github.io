name: Sync profile README
on:
  workflow_run:
    workflows: ['Deploy website']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: profile-readme-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require profile write credential
        env:
          GH_TOKEN: ${{ secrets.PROFILE_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::Configure PROFILE_REPO_TOKEN with Contents write access to the profile repository.'
            exit 1
          fi
      - name: Read profile destination
        id: config
        run: node -e "console.log('repository=' + require('./config.json').profile.repository)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.config.outputs.repository }}
          token: ${{ secrets.PROFILE_REPO_TOKEN }}
          path: profile-repo
      - name: Generate from website content
        run: node .github/workflows/update-profile-readme.js
      - name: Publish changed profile README
        working-directory: profile-repo
        run: |
          if git diff --quiet -- README.md; then
            echo 'Profile already matches website content.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Sync profile README from website content'
          git push
