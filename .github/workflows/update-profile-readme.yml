name: Update GitHub profile README

on:
  push:
    branches: [main]
    paths: [config.json, template-version.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-readme
  cancel-in-progress: false

env:
  PORTFOLIO_CONFIG: ${{ github.workspace }}/config.json
  PORTFOLIO_OUTPUT: ${{ github.workspace }}/.portfolio-engine/dist

jobs:
  update-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout portfolio content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read pinned engine version
        id: engine
        run: echo "version=$(jq -r .version template-version.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned portfolio engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: yashrajnayak/developer-portfolio
          ref: ${{ steps.engine.outputs.version }}
          path: .portfolio-engine

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .portfolio-engine/package-lock.json

      - name: Install engine dependencies
        working-directory: .portfolio-engine
        run: npm ci

      - name: Generate profile README from schema
        working-directory: .portfolio-engine
        run: npm run build

      - name: Check profile repository token
        id: token
        env:
          GH_TOKEN: ${{ secrets.PROFILE_REPO_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ] && gh api repos/yashrajnayak/yashrajnayak >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::PROFILE_REPO_TOKEN is unavailable; skipped profile README sync."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout profile repository
        if: steps.token.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: yashrajnayak/yashrajnayak
          token: ${{ secrets.PROFILE_REPO_TOKEN }}
          path: profile-repo

      - name: Preserve live repository feed and update README
        if: steps.token.outputs.available == 'true'
        run: node .github/scripts/update-profile-readme.mjs .portfolio-engine/dist/profile-readme.md profile-repo/README.md

      - name: Commit generated allowlist
        if: steps.token.outputs.available == 'true'
        working-directory: profile-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md
          git diff --cached --quiet || git commit -m "Update profile README from portfolio schema"
          git push
