name: Sync profile README
on:
  workflow_run:
    workflows: ['Deploy website']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: profile-readme-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Resolve successfully deployed revision
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const {resolveDeployment} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/profile-deployment.mjs`);
            await resolveDeployment({github, context, core});
      - uses: actions/checkout@v4
        if: steps.deployment.outputs.publish == 'true'
        with:
          ref: ${{ steps.deployment.outputs.sha }}
      - uses: actions/setup-node@v4
        if: steps.deployment.outputs.publish == 'true'
        with:
          node-version: '24'
      - name: Require profile write credential
        if: steps.deployment.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.PROFILE_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::Configure PROFILE_REPO_TOKEN with Contents write access to the profile repository.'
            exit 1
          fi
      - name: Read profile destination
        if: steps.deployment.outputs.publish == 'true'
        id: config
        run: node -e "console.log('repository=' + require('./config.json').profile.repository)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.deployment.outputs.publish == 'true'
        with:
          repository: ${{ steps.config.outputs.repository }}
          token: ${{ secrets.PROFILE_REPO_TOKEN }}
          path: profile-repo
      - name: Generate from website content
        if: steps.deployment.outputs.publish == 'true'
        run: node .github/workflows/update-profile-readme.js
      - name: Recheck deployment before publishing
        id: guard
        if: steps.deployment.outputs.publish == 'true'
        uses: actions/github-script@v7
        env:
          DEPLOYED_SHA: ${{ steps.deployment.outputs.sha }}
          DEPLOYED_RUN_ID: ${{ steps.deployment.outputs.run-id }}
          DEPLOYED_ATTEMPT: ${{ steps.deployment.outputs.attempt }}
        with:
          script: |
            const {resolveDeployment} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/profile-deployment.mjs`);
            await resolveDeployment({github, context, core}, {sha: process.env.DEPLOYED_SHA, runId: process.env.DEPLOYED_RUN_ID, attempt: process.env.DEPLOYED_ATTEMPT});
      - name: Publish changed profile README
        if: steps.guard.outputs.publish == 'true'
        working-directory: profile-repo
        run: |
          if git diff --quiet -- README.md; then
            echo 'Profile already matches website content.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Sync profile README from website content'
          git push
