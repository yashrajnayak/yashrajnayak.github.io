name: Propose portfolio engine upgrade

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to test; leave blank for the latest release
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: portfolio-engine-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout portfolio content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          CURRENT=$(jq -r .version template-version.json)
          TARGET="$REQUESTED_VERSION"
          if [ -z "$TARGET" ]; then
            TARGET=$(gh release view --repo yashrajnayak/developer-portfolio --json tagName --jq .tagName)
          fi
          gh release view "$TARGET" --repo yashrajnayak/developer-portfolio >/dev/null
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "$TARGET" ]; then echo "up_to_date=true" >> "$GITHUB_OUTPUT"; fi

      - name: Update pinned release
        if: steps.release.outputs.up_to_date != 'true'
        env:
          TARGET: ${{ steps.release.outputs.target }}
        run: node -e "const fs=require('fs');const p='template-version.json';const d=JSON.parse(fs.readFileSync(p));d.version=process.env.TARGET;d.release_url='https://github.com/'+d.repository+'/releases/tag/'+process.env.TARGET;fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n')"

      - name: Test target release
        if: steps.release.outputs.up_to_date != 'true'
        env:
          TARGET: ${{ steps.release.outputs.target }}
          PORTFOLIO_CONFIG: ${{ github.workspace }}/config.json
          PORTFOLIO_OUTPUT: ${{ github.workspace }}/.portfolio-engine/dist
        run: |
          git clone --depth 1 --branch "$TARGET" https://github.com/yashrajnayak/developer-portfolio.git .portfolio-engine
          npm ci --prefix .portfolio-engine
          (cd .portfolio-engine && npx playwright install --with-deps chromium)
          cd .portfolio-engine
          npm run validate:config -- "$PORTFOLIO_CONFIG"
          npm run build
          npm run validate:html
          npm run check:links
          npm run test:unit
          npm run test:e2e
          npm audit --audit-level=moderate

      - name: Open tested upgrade pull request
        if: steps.release.outputs.up_to_date != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.release.outputs.target }}
          CURRENT: ${{ steps.release.outputs.current }}
        run: |
          BRANCH="chore/portfolio-engine-${TARGET}-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- template-version.json
          git commit -m "Upgrade portfolio engine to $TARGET"
          git push --set-upstream origin "$BRANCH"
          gh pr create --draft --title "Upgrade portfolio engine to $TARGET" --body "Updates the pinned engine from $CURRENT to $TARGET. Schema, static build, HTML, links, unit tests, Playwright, axe, and dependency audit passed before this PR was opened."
