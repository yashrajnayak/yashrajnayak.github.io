name: Validate Site
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate-site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate config, rendering and generated assets
        run: |
          npm run sync:favicons
          npm run build
          npm run check
          npm run sync:favicons:check
          npm test
